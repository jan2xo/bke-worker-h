name: Hydrogen Sandbox CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop-extension-and-contracts:
    name: Clean Desktop Extension, Native Host & Contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Clean isolated browser-extension install and build
        working-directory: bke-worker/browser-extension
        run: |
          npm install --ignore-scripts --no-audit --no-fund --package-lock=false
          npm run check
          npm run controller:doctor
          npm run smoke:native -- --report "$RUNNER_TEMP/desktop-native-smoke-report.json"

      - name: Run certification harness and input-only boundary lint
        working-directory: bke-worker
        run: |
          bash scripts/certify-forge-f1-desktop-mvp.sh --sandbox --dry-run
          node scripts/input-only-lint.mjs
          node --test scripts/input-only-lint.test.mjs

      - name: Verify Cloudflare relay protocol & reconnect recovery planner
        working-directory: bke-worker/cloudflare-relay
        run: |
          npm run check
          npm run reconnect-recovery-test

      - name: Verify operator, Android, readiness & security contracts
        working-directory: bke-worker
        run: |
          python3 tests/forge_f1_desktop_mvp_contract.py
          python3 tests/forge_f1_desktop_readiness_contract.py
          python3 tests/chrome_native_host_installer_contract.py
          python3 tests/operator_entrypoint_contract.py
          python3 tests/android_gecko_probe_contract.py
          python3 tests/android_recovery_operator_contract.py
          python3 tests/cloudflare_relay_contract.py
          node --test tests/admin_preproduction_activation.test.mjs
          bash tests/chrome_native_host_installer_contract.sh
          bash scripts/package-desktop-worker.sh package --out "$RUNNER_TEMP/desktop-pkg"
          node -e '
            const fs = require("node:fs");
            const m = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/desktop-pkg/package-manifest.json", "utf8"));
            if (m.live_send_locked_false !== true) throw new Error("live_send_locked_false must be true");
            if (m.execution_envelope_default_disabled !== true) throw new Error("execution_envelope_default_disabled must be true");
          '
          bash scripts/package-desktop-worker.sh verify --out "$RUNNER_TEMP/desktop-pkg"
          bash scripts/package-desktop-worker.sh clean-uninstall --out "$RUNNER_TEMP/desktop-pkg"
